<svg xmlns="http://www.w3.org/2000/svg" width="840.0" height="400.0" viewBox="0 0 840.0 400.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111722" />
      <stop offset="1" stop-color="#0d1117" />
    </linearGradient>
  </defs>
  
  <rect width="840.0" height="400.0" rx="12" fill="url(#bg)" />
  <rect x="0.5" y="0.5" width="839.0" height="399.0" rx="12" fill="none" stroke="#30363d" stroke-width="1" />
  
  <line x1="0" y1="30" x2="840.0" y2="30" stroke="#30363d" />
  <circle cx="20" cy="15.0" r="5" fill="#ff5f56" />
  <circle cx="36" cy="15.0" r="5" fill="#ffbd2e" />
  <circle cx="52" cy="15.0" r="5" fill="#27c93f" />
  <text x="420.0" y="19.0" fill="#7d8590" font-size="12" text-anchor="middle">dj@github: ~$ ./hologram.sh</text>

  <clipPath id="r1">
    <rect x="20" y="70.0" height="30" width="0">
      <animate attributeName="width" from="0" to="800.0" begin="0.0s" dur="1s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#r1)">
    <text xml:space="preserve" x="20" y="95" fill="#00f3ff" font-size="20" font-weight="bold">
      > SYSTEM ONLINE: D.J REPO
    </text>
  </g>

  <clipPath id="r2">
    <rect x="20" y="130.0" height="30" width="0">
      <animate attributeName="width" from="0" to="800.0" begin="0.8s" dur="1s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#r2)">
    <text xml:space="preserve" x="20" y="155" fill="#c9d1d9" font-size="16">
      > STATUS: HOLOGRAPHIC MODE ACTIVE
    </text>
  </g>

  <line x1="0" y1="350" x2="840.0" y2="350" stroke="#30363d" />
  <text x="20" y="375" fill="#7d8590" font-size="13">dj@github:~$ ready <tspan fill="#00f3ff">_</tspan></text>
  <rect x="135" y="363" width="8" height="14" fill="#00f3ff">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite" />
  </rect>
</svg>
